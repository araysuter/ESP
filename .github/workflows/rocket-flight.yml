name: Rocket flight checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Flight core checks
        run: dotnet run --configuration Release --project FlightCore.Tests/FlightCore.Tests.csproj
      - name: Atmosphere checks
        run: dotnet run --configuration Release --project Atmosphere.Tests/Atmosphere.Tests.csproj
      - name: Reference frame checks
        run: dotnet run --configuration Release --project Frames.Tests/Frames.Tests.csproj
      - name: Rocket checks
        run: dotnet run --configuration Release --project Rocket.Tests/Rocket.Tests.csproj
      - name: Mission checks
        run: dotnet run --configuration Release --project Mission.Tests/Mission.Tests.csproj
      - name: Historical weather force probe
        run: dotnet run --configuration Release --project Atmosphere.Probe/Atmosphere.Probe.csproj -- data/weather/geos-fp-lc39a-20261114T0900Z.json --at 2026-11-14T10:00:00Z

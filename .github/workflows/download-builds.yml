name: Downloadable app builds
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v)'
        required: true
        default: '0.1.0'
      publish:
        description: 'Publish packages as a GitHub release after both platforms pass'
        type: boolean
        default: false
      platform:
        description: 'Platforms to build (publishing requires both)'
        type: choice
        options: [both, windows, macos]
        default: both
permissions:
  contents: read
concurrency:
  # Serialize only competing publications or matching rehearsals, not all builds.
  group: ${{ (github.event_name == 'release' || inputs.publish) && format('esp-publish-{0}', github.event.release.tag_name || format('v{0}', inputs.version)) || format('esp-rehearsal-{0}-{1}', github.ref, inputs.platform || 'both') }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Validate release version and source
        id: version
        uses: actions/github-script@v7
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          PLATFORM: ${{ inputs.platform }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          script: |
            const tag = context.eventName === 'release' ? context.payload.release.tag_name : 'v' + process.env.REQUESTED_VERSION;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Use a version such as v0.1.0');
            if (!process.env.UNITY_EMAIL || !process.env.UNITY_PASSWORD) throw new Error('Set UNITY_EMAIL and UNITY_PASSWORD in repository Actions secrets. No UNITY_LICENSE file is needed.');
            if (process.env.PUBLISH === 'true' && process.env.PLATFORM !== 'both') throw new Error('Publishing requires both platforms. Select both or disable publish.');
            const sha = context.sha;
            if (context.eventName === 'release' || process.env.PUBLISH === 'true') {
              const {data} = await github.rest.repos.compareCommitsWithBasehead({...context.repo, basehead: sha + '...main'});
              if (!['ahead', 'identical'].includes(data.status)) throw new Error('Release source must be on main');
            }
            core.setOutput('version', tag.slice(1)); core.setOutput('tag', tag); core.setOutput('sha', sha);
  # Independent jobs allow Windows packaging to start while macOS is still
  # compiling. Each runner owns its own checkout and Unity Library cache.
  macos-build:
    if: ${{ github.event_name == 'release' || inputs.platform != 'windows' }}
    needs: prepare
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          lfs: true
          persist-credentials: false
      - name: Check source assets
        shell: bash
        run: |
          git lfs fsck
          test "$(wc -c < UnityProject/Assets/ESP/Art/Sky/CelestialSky.exr)" -gt 1000000
          df -h .
      # Cache only the versioned editor installation, never Hub/account state.
      - name: Prepare editor cache directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /Applications/Unity/Hub/Editor
      - name: Restore Unity editor
        id: editor-cache
        uses: actions/cache/restore@v4
        with:
          path: /Applications/Unity/Hub/Editor/6000.6.9f1
          key: unity-editor-v1-macos-15-${{ runner.arch }}-6000.6.9f1-mac-il2cpp
      - name: Restore imported Unity assets
        id: library-cache
        uses: actions/cache/restore@v4
        with:
          path: UnityProject/Library
          key: unity-6000.6.9f1-StandaloneOSX-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**', 'FlightCore/**') }}
          restore-keys: unity-6000.6.9f1-StandaloneOSX-
      - name: Build release player
        id: unity-build
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.75
          projectPath: UnityProject
          targetPlatform: StandaloneOSX
          buildName: ESP
          buildsPath: build
          buildMethod: BuildMission.Build
          versioning: Custom
          version: ${{ needs.prepare.outputs.version }}
          customParameters: -espRelease -espVersion ${{ needs.prepare.outputs.version }} -espBuildPath build/StandaloneOSX/ESP.app
      - name: Save Unity editor
        if: steps.unity-build.outcome == 'success' && steps.editor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/Unity/Hub/Editor/6000.6.9f1
          key: ${{ steps.editor-cache.outputs.cache-primary-key }}
      # Save after compilation, so a later packaging/smoke failure does not
      # discard the expensive import and shader cache.
      - name: Save imported Unity assets
        if: steps.unity-build.outcome == 'success' && steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: UnityProject/Library
          key: ${{ steps.library-cache.outputs.cache-primary-key }}
      - name: Bundle notices and build provenance
        shell: bash
        env:
          TARGET: StandaloneOSX
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 packaging/bundle-notices.py "build/$TARGET" "$VERSION" "$SOURCE_SHA"
      - name: Package and check macOS DMG
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash packaging/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: ESP-macOS
          path: dist/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-StandaloneOSX
          path: |
            build/**/*.log
            artifacts/**
          if-no-files-found: ignore
          retention-days: 7
  windows-build:
    if: ${{ github.event_name == 'release' || inputs.platform != 'macos' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          lfs: true
          persist-credentials: false
      - name: Check source assets
        shell: bash
        run: |
          git lfs fsck
          test "$(wc -c < UnityProject/Assets/ESP/Art/Sky/CelestialSky.exr)" -gt 1000000
          df -h .
      - name: Restore imported Unity assets
        id: library-cache
        uses: actions/cache/restore@v4
        with:
          path: UnityProject/Library
          key: unity-6000.6.9f1-StandaloneWindows64-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**', 'FlightCore/**') }}
          restore-keys: unity-6000.6.9f1-StandaloneWindows64-
      - name: Build release player
        id: unity-build
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.75
          projectPath: UnityProject
          targetPlatform: StandaloneWindows64
          buildName: ESP
          buildsPath: build
          buildMethod: BuildMission.Build
          versioning: Custom
          version: ${{ needs.prepare.outputs.version }}
          customParameters: -espRelease -espVersion ${{ needs.prepare.outputs.version }} -espBuildPath build/StandaloneWindows64/ESP.exe
      # The Linux builder container creates these generated files as root.
      - name: Restore runner ownership of Windows build output
        run: sudo chown -R "$(id -u):$(id -g)" build UnityProject/Library
      # Save after compilation, so a later packaging/smoke failure does not
      # discard the expensive import and shader cache.
      - name: Save imported Unity assets
        if: steps.unity-build.outcome == 'success' && steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: UnityProject/Library
          key: ${{ steps.library-cache.outputs.cache-primary-key }}
      - name: Bundle notices and build provenance
        shell: bash
        env:
          TARGET: StandaloneWindows64
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 packaging/bundle-notices.py "build/$TARGET" "$VERSION" "$SOURCE_SHA"
      - name: Archive Windows player for native installer packaging
        run: tar -czf windows-player.tar.gz -C build/StandaloneWindows64 .
      - uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: windows-player
          path: windows-player.tar.gz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-StandaloneWindows64
          path: |
            build/**/*.log
            artifacts/**
          if-no-files-found: ignore
          retention-days: 7
  windows-installer:
    if: ${{ github.event_name == 'release' || inputs.platform != 'macos' }}
    needs: [prepare, windows-build]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-player
      - name: Package and smoke test Windows installer
        shell: pwsh
        env:
          ESP_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./packaging/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ESP-Windows
          compression-level: 0
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-smoke-log
          path: build/windows-smoke.log
          if-no-files-found: ignore
  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: [prepare, macos-build, windows-build, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ESP-*
          merge-multiple: true
          path: dist
      - name: Attach verified packages to the versioned release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const tag = process.env.RELEASE_TAG, version = process.env.RELEASE_VERSION;
            const names = [`ESP-${version}-macOS.dmg`, `ESP-${version}-Windows-Setup.exe`, `ESP-${version}-Windows.zip`];
            for (const name of names) if (!fs.existsSync('dist/' + name)) throw new Error('Missing package: ' + name);
            const sums = names.map(name => crypto.createHash('sha256').update(fs.readFileSync('dist/' + name)).digest('hex') + '  ' + name).join('\n') + '\n';
            fs.writeFileSync('dist/SHA256SUMS.txt', sums); names.push('SHA256SUMS.txt');
            let release, created = false;
            try { release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              created = true;
              release = (await github.rest.repos.createRelease({...context.repo, tag_name: tag, target_commitish: process.env.SOURCE_SHA,
                name: 'ESP ' + tag, draft: true, prerelease: false,
                body: `Download the macOS DMG or Windows installer below. A portable Windows ZIP is also included.\n\nBuilt from ${process.env.SOURCE_SHA} with Unity 6000.6.9f1 on standard GitHub-hosted runners. Packages include source/license notices. Packages are not Developer ID notarized or Windows Authenticode signed. CI checks package installation and headless startup/ascent on both platforms; graphical macOS acceptance is separate on Studio, and Windows still needs an interactive PC playtest.\n\nmacOS: open the DMG and drag ESP to Applications. Windows: run the Setup.exe, or extract the entire portable ZIP and run ESP.exe. Checksums are in SHA256SUMS.txt.`})).data;
            }
            if (!created) {
              const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref: tag});
              if (commit.sha !== process.env.SOURCE_SHA) throw new Error('Release tag points to a different commit; refusing replacement');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: release.id});
            for (const name of names) {
              const old = assets.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data: fs.readFileSync('dist/' + name)});
            }
            if (release.draft) await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false});
            await core.summary.addLink('Download ESP ' + tag, release.html_url).write();
